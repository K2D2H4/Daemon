[project]
# The product is "Daemon"; the distributable is "daemon-ai" because `daemon` is
# long taken on PyPI and npm and collides with the unix sense of the word.
# The import package stays `daemon`. `heydaemon` is held in reserve - it is free
# on both registries and unused on GitHub - if a distinct wake word is ever
# wanted for voice.
name = "daemon-ai"
# The version lives in `daemon/__init__.py:__version__`; hatchling reads it below.
# One number, so `daemon --version` and the wheel metadata cannot drift apart.
dynamic = ["version"]
description = "An open-source, self-hosted AI companion that you shape - and that reshapes itself around you."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Recall's vector search. Brute-force cosine over one person's history:
    # measured 0.18 ms at 10k messages, 1.07 ms at 50k. Deliberately not a
    # sqlite extension - this very Python build has enable_load_extension
    # disabled, so sqlite-vec cannot load, and self-hosters would hit the same.
    "numpy>=2.0",
    # Voice is default-on for macOS (spec §4.6). The recognizer used to live only
    # behind the `voice` extra, and both the one-liner installer and `daemon
    # update` install bare `daemon-ai` — so an update silently dropped voice and
    # the wake gate went deaf while /health still said running. Making these core
    # on darwin removes the extra that kept getting stripped. Linux keeps the lean
    # core and reaches voice through the `[voice]` extra below.
    #
    # `google-auth` is here for the same reason, one feature later: the admin console
    # offers DAEMON_GEMINI_LIVE_TRANSPORT=vertex on every install where voice is on, so
    # an install that cannot mint a bearer token can select an endpoint it will then
    # fail to reach - at the first voice turn, permanently, with the reason in a log.
    # Measured on the owner's own machine the day v0.1.79 shipped: the uv receipt read
    # extras ["mcp", "face"], `google.auth` was absent, and `daemon update` would have
    # carried that forward. It stays in `[voice]` below as well, which is how Linux
    # reaches it (ADR 0020).
    "websockets>=14.0; sys_platform == 'darwin'",
    "google-auth>=2.0; sys_platform == 'darwin'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "certifi>=2024.0; sys_platform == 'darwin'",
    "onnxruntime>=1.20; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
    # Screen sharing (on by default) hard-imports Pillow from run_voice's
    # ScreenShareController - a missing Pillow crashed the voice session on the first
    # wake word (measured on the owner's Mac). Voice is core on macOS, so Pillow is
    # too; it stays in the [voice] extra below for Linux. run_voice also guards the
    # import now, so a bare install degrades to "no screen sharing" rather than crash.
    "Pillow>=10.0; sys_platform == 'darwin'",
    # read_file's PDF path (daemon/tools/extract.py). Pure Python, no system
    # libraries - deliberately not PyMuPDF, whose compiled wheels a self-hoster on
    # an odd platform can't always get. The Office formats (.docx/.xlsx/.pptx)
    # need nothing beyond the standard library, so only PDF costs a dependency;
    # a companion asked to "read this file" should not choke on the commonest
    # document there is.
    "pypdf>=5.0",
]

[project.optional-dependencies]
voice = [
    # Only needed when DAEMON_VOICE_ENABLED is on. Kept out of the core so a
    # text-only install does not need PortAudio.
    "websockets>=14.0",
    "sounddevice>=0.5",
    # DAEMON_GEMINI_LIVE_TRANSPORT=vertex only, and imported lazily inside
    # daemon/voice/vertex.py so the API-key transport never loads it. That endpoint
    # authenticates with a bearer token rather than a key (ADR 0020); the
    # alternative was signing service-account JWTs here, which trades this
    # dependency for an RSA one.
    "google-auth>=2.0",
    # screen-share only — resize + perceptual-hash dedup; capture itself is
    # dependency-free.
    "Pillow>=10.0",
    # Declared rather than relied on transitively through httpx, because the voice
    # session imports it directly. websockets uses ssl.create_default_context(),
    # which on a python.org framework build has zero CAs unless someone ran
    # "Install Certificates.command" - measured here: 0 against certifi's 121. So
    # every such install failed TLS on the first voice turn with an error that
    # looked like the user's network.
    "certifi>=2024.0",
    # The wake gate's VAD (daemon/voice/vad.py) runs the vendored Silero graph on
    # this and numpy alone - deliberately not the `silero-vad` package, whose
    # torchaudio import fails outright against the installed torch here. Listed
    # because `SileroVad` raises an AudioUnavailable that tells the reader to run
    # `pip install -e '.[voice]'`, and until this line existed that command did not
    # install the thing the message was about.
    "onnxruntime>=1.20",
    # The wake gate's recognizer (daemon/voice/apple_speech.py). macOS only, and
    # marked as such so `pip install '.[voice]'` still resolves on Linux - there
    # the Apple recognizer is simply unavailable and `available` returns False.
    # Speech is the recognizer; AVFoundation is the PCM buffer it is fed.
    "pyobjc-framework-Speech>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]
mcp = [
    # Only needed when DAEMON_MCP_ENABLED is on. The built-in tools need nothing
    # beyond the standard library, so an install that only wants Daemon to reach
    # its own machine does not take this on. Imported from daemon/tools/mcp.py
    # alone, which is also where a v2 API change would land.
    #
    # Capped below 2.0: mcp 2.0.0 is a major with a different client surface
    # (`mcp.client.streamable_http.streamablehttp_client` is gone, among others),
    # and daemon/tools/mcp.py is written against the 1.x client. Left uncapped, a
    # fresh install resolved 2.0.0 and url/remote servers broke at import - green
    # locally on a pinned 1.x, ImportError in CI. Lift this when that one file is
    # ported to the v2 surface.
    "mcp>=1.9,<2",
]
face = [
    # Needed when face lip-sync (MuseTalk) is turned on: `daemon/app.py`'s
    # `_build_lipsync` constructs the whole render path behind
    # `DAEMON_FACE_LIPSYNC_ENABLED`, and `daemon/face_lipsync/render.py` imports cv2
    # directly. CI needs the extra regardless, because the tests import that module
    # unconditionally.
    # opencv-python-headless, not opencv-python: this runs on a server with no
    # display, so the GUI/Qt bindings the non-headless wheel links against are
    # dead weight neither install nor CI has any use for.
    #
    # `<5` is a real bound, not caution. An unbounded floor resolved to 5.0.0 on a
    # fresh install of this extra, and every judgement the render path has been tuned
    # against - MOTION_BLEND, RELEASE_FRAMES, the detail transfer - was made on 4.11
    # against `GaussianBlur`, `resize` and `imencode`. A major bump under the one
    # thing the owner judges by eye is not a variable to leave open.
    "opencv-python-headless>=4.10,<5",
    # Apple-silicon only, and marked as such because CI is ubuntu: mlx publishes no
    # Linux wheels, so an unmarked entry makes `pip install .[face]` fail there
    # outright rather than skip. Nothing CI imports pulls these in - test_reachable
    # reads daemon/*.py as text, and the mlx-only modules are exercised by
    # evals/face_lipsync_numerics.py by hand.
    "mlx>=0.22; platform_system=='Darwin' and platform_machine=='arm64'",
    # For whisper's mel front-end and encoder weights. Verified to reproduce
    # transformers' own output exactly (mel cosine 1.000000, encoder states
    # 1.000000/0.999997).
    #
    # It does NOT save the torch dependency, and this comment claimed it did.
    # Measured installing this extra on 2026-08-31: `mlx-whisper 0.4.3` declares a
    # bare `torch` requirement, so the extra pulls torch in regardless of the mel
    # front-end being MLX. What the MLX port buys is the encoder running on MLX at
    # the frame budget; the install is still ~2.5GB heavier than this said.
    "mlx-whisper>=0.4; platform_system=='Darwin' and platform_machine=='arm64'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
daemon = "daemon.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "daemon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored third-party source, byte-identical to upstream on purpose. Linting it
# would produce a diff we are not allowed to apply - see daemon/face_lipsync/vendor.
extend-exclude = ["daemon/face_lipsync/vendor/mlx_sd/config.py",
                  "daemon/face_lipsync/vendor/mlx_sd/unet.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
