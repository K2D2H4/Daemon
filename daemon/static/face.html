<!doctype html>
<meta charset="utf-8">
<title>face</title>
<!--
  Self-contained, offline, one file - the same posture as the admin shell. It talks to
  five routes on its own origin and loads nothing else.

  Two mouths, and only one of them is here. v1's is this file's own: a speaking clip
  whose playbackRate follows the level (spec 3.4), which cannot make a phoneme. The
  other is rendered by the daemon and arrives on /face/frames as the WHOLE composited
  frame, replacing the clip it was cut from rather than laid over it. It is off by
  default, and everything below treats it as an overlay that can vanish mid-sentence
  rather than as a mode the page switches into - see mouthReady/mouthLive.

  Three details here are the whole difference between "alive" and "wrong", and all
  three were learned by getting them wrong first:

  1. PRIMING. Every clip is play-then-paused once on load so a decoded frame exists.
     Without it the first switch to a cold clip flashes the page background.
  2. SINGLE-SIDED CROSSFADE. Only the incoming element's opacity animates, on top,
     while the outgoing one stays fully opaque underneath until the fade finishes.
     Fading both at once leaves a moment where neither is opaque, the background shows
     through, and the brightness dips - which reads worse than a hard cut. The hide
     that follows the fade has to check the element is still the outgoing one: come
     back to it within fadeMs and the stale timer blanks BOTH layers (see show()).
  3. NO rAF TIMEKEEPING. <video> playback is native, unlike requestAnimationFrame,
     which throttles in a backgrounded window - rAF only nudges playbackRate, so
     being throttled makes it update less often rather than drift. Native playback
     is not immune to the browser either, though (spec 3.8 claimed it was, and that
     was wrong): Chrome pauses muted background video to save power even in a
     merely-occluded window, measured live - see ensurePlaying(), below.
     And "throttles" is generous: in an occluded window rAF stops outright, measured
     while building the lip-sync overlay. Anything whose LATENESS is a defect rather
     than a cosmetic lag therefore cannot live in tick() - see refreshMouth().
     The lip-synced frames themselves DO present from tick(), and that is not a
     contradiction: a late frame there is a cosmetic lag over a window nobody is
     looking at, and rAF stopping only holds the last frame that was already up.
     What must never wait on rAF is the mouth going AWAY, which is still
     event-driven. See presentMouth() and refreshMouth(), which are separate for
     exactly this reason.
-->
<style>
  :root { --bg: #19191B; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* z-index 0 makes #stage a stacking context, which is the only way #mouth stays
     above every clip: show() hands the incoming clip ++z, so a fixed number on a
     sibling would eventually lose the race. Contained here, it never can. */
  #stage { position: fixed; inset: 0; z-index: 0; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 180ms linear;
  }
  /* The lip-synced face: the WHOLE composited frame, same geometry as the clips it
     replaces, so there is nothing to position and nothing to line up. Two earlier
     versions of this laid a crop of the mouth over the playing clip and both drew a
     visible rectangle - a JPEG has no alpha, so its edge is hard however small it is,
     and the clip underneath is never on the frame the renderer drew.
     A <canvas>, not an <img>, for the reason presentMouth() gives - and object-fit
     applies to it identically (verified in Chrome: a 1080x1620 canvas letterboxes
     into a 900x1000 box at 666px wide, against 667px of arithmetic), so this is the
     same geometry the <img> had and there is still nothing to line up. */
  #mouth {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 180ms linear;
    z-index: 1; pointer-events: none;
  }
  #hint {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem;
    color: #8a8a90; font: 13px/1.7 -apple-system, system-ui, sans-serif;
    text-align: center; z-index: 2;
  }
  #hint code { color: #d8d8dc; }
  @media (prefers-reduced-motion: reduce) {
    video, #mouth { transition: none; }
  }
</style>

<div id="stage"></div>
<canvas id="mouth"></canvas>
<div id="hint" hidden></div>

<script>
"use strict";

const FADE_MS = 180;          // spec 3.2 - fast fade: speaking's mouth-snap and mood
                               // one-shots, where immediacy matters more than smoothness
const FADE_SLOW_MS = 400;     // spec 3.2 - listening/thinking/working and the idle
                               // return, where nothing is urgent and a mismatched pose
                               // needs longer to read as deliberate rather than a cut.
                               // A starting value, not a measured one: 180ms measurably
                               // read as a cut on a real window, and only the owner's
                               // eye against a real window can settle where this lands.
const NEUTRAL_WAIT_CAP_MS = 1200;
// task 9 (3rd follow-up): supersedes the original wait rule that used to sit
// here (WAIT_MS). That rule only checked whether the outgoing clip was near
// its own natural end - measured (at a different scale) to be a narrow
// window, so it rarely fired. Re-measured against this page's own scale
// (face_match.py's own _frames): most clips are near neutral MOST of the
// time (median wait across every loop clip is 0s), just not necessarily at
// the literal end - so the fix is to wait for the next near-neutral MOMENT,
// wherever it falls, not only the clip's own finish. 1.2s is a round cap in
// the ballpark of that measurement, not a per-clip guarantee: some clips'
// own p90 (thinking 2.3s, working 1.8s) run past it, so this only bounds how
// long the page waits before giving up and switching anyway via the pose-
// matched entry point - it does not promise neutral is reached.
const RATE_MIN = 0.85;        // below ~0.8 reads as slow motion
const RATE_MAX = 1.25;        // above ~1.3 reads as fast-forward
const ATTACK = 0.30;          // fast open
const RELEASE = 0.06;         // slow close - real mouths are asymmetric
const IDLES = ["idle1", "idle2", "idle3"];
const FLOURISHES = ["flourish_arms"];
const FLOURISH_MIN_MS = 15000, FLOURISH_MAX_MS = 60000;
// Down from the 40-120s spec open question 6 admitted was a guess, but **the
// interval was never why the flourish did not appear** - advance() was re-arming
// the deadline on every idle clip's end (see there). An earlier revision of this
// comment blamed the interval, citing a live session whose longest uninterrupted
// idle stretch was 36s. That number is real and it is the wrong explanation: the
// flourish is for the long ambient idle *after* a session, not for gaps inside one,
// and with the re-arm fixed 40-120s would have worked too.
//
// So this is now a taste choice and labelled as one: 15-60s makes the gesture
// something the owner actually sees while the face sits there, averaging 37s
// against the spec's "once a minute breaks the loop's visible period".
const LOUD_ENTER = 0.27, LOUD_HOLD_MS = 500;
// Now a measurement. Taken off the running resident's own /face/stream through a
// live 8-turn voice session, with this file's ATTACK/RELEASE filter replayed over
// the captured levels so the number sits on the same `env` scale the comparison
// below uses: 295 samples, median 0.233, p75 0.254, **p90 0.272**, p99 0.307,
// max 0.315. The old 0.62 cleared *nothing* - `speaking_loud` was a rendered clip
// that could not play. 0.27 is that p90, and with LOUD_HOLD_MS it engaged 4 times
// across those 8 turns (0.26 -> 8, 0.25 -> 16, which is fidgeting, and 0.30 -> 1).
//
// What the same data says about spec open question 3 ("keep speaking_loud?"): this
// speaker has **no loud mode**. The whole envelope lives in 0.23-0.32 on a scale
// where a full-scale sine reaches 0.707, so this threshold selects her loudest
// decile rather than detecting loudness in any absolute sense. Kept because the
// clip exists and the top decile is a real, repeatable part of the signal - but
// one session, one voice, one provider. logEnvelope() below still prints a summary
// per speaking turn, and that is still the thing to read before moving this.
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOUTH_STALE_MS = 250;   // How long the last lip-sync frame stays believable.
                               // Frames arrive every 41.67ms, but a gap of a tick or
                               // two is normal, not broken: a model step covers two
                               // frames and cannot start until the second one's audio
                               // has arrived, so the renderer answers "not yet" on
                               // some ticks by design (/face/frames). Six frames
                               // clears that; much longer and a renderer that latched
                               // failed mid-sentence reads as a frozen face, which is
                               // the exact thing the fallback exists to prevent.
const MOUTH_PERIOD_MS = 1000 / 24;  // The renderer's own frame period, and so the rate
                               // presentMouth() puts frames up at. NOT a running
                               // estimate of the rate they ARRIVE at: they arrive at
                               // 23.5-24.0fps and wander, and a clock that chased that
                               // came out worse (65.4% of frames on the modal dwell
                               // against 81.7% - simulated over real arrival stamps,
                               // so treat the gap as the finding and not the figures).
                               // The reason is not about the source at all: 41.67ms is
                               // a whole number of refreshes at 120Hz and 2.5 at 60Hz,
                               // and either repeating pattern reads better than a
                               // period that beats against the display.
const MOUTH_CATCH_UP = 2;     // Queue depth presentMouth() will hold before it stops
                               // waiting for the slot and presents on every tick until
                               // it is level again. Measured, and the difference
                               // between a fix and half of one. At 1, a burst of two
                               // frames inside one slot forced the second out early
                               // immediately - 42% of frames went up ahead of their
                               // slot, and the page landed at 51% on the modal dwell
                               // with 25% of pairs changing duration and a worst dwell
                               // of 82ms, barely better than the <img> it replaced. At
                               // 2 a burst pair is absorbed and only a real backlog
                               // moves the clock: 72.5%, 13.6%, and 51ms.
                               // Holding an early frame is not added lag, it is the
                               // correction: the renderer draws for AUDIBLE time, so a
                               // frame that arrived early is a frame that would have
                               // led the sound. 3 was tried and the run was void - the
                               // machine was loaded and the renderer itself fell to
                               // 15fps - so 2 is where the evidence actually reaches.
const MOUTH_QUEUE_MAX = 4;    // Decoded frames held at once. A bound, not a buffer:
                               // presentMouth() drains one per period and the queue
                               // sits around MOUTH_CATCH_UP, but rAF STOPS in an
                               // occluded window while the socket keeps delivering,
                               // and an ImageBitmap of a 1080x1620 frame is ~7MB.
                               // Four caps that at 28MB.

// activity -> clip, with the fallback chain from spec §3.7 applied at load time.
const FOR_ACTIVITY = {
  idle: IDLES,
  listening: ["listening", "idle1"],
  thinking: ["thinking", "idle1"],
  working: ["working", "thinking", "idle1"],
  speaking: ["speaking_soft", "idle1"],
};

// Which activities get the slow fade (spec 3.2). speaking is deliberately absent:
// its mouth-snap, and the mood one-shots in playOneShot() below, keep FADE_MS.
const SLOW_FADE_ACTIVITIES = new Set(["listening", "thinking", "working", "idle"]);

// Which activities may wait (spec 3.2, generalised beyond idle) for the outgoing
// clip's next near-neutral moment before cutting - see neutralWaitMs() below.
// Same membership as SLOW_FADE_ACTIVITIES today - kept as its own constant
// because fade speed and wait eligibility are separate questions that happen
// to share an answer, not one concern with two names.
const WAIT_ACTIVITIES = new Set(["listening", "thinking", "working", "idle"]);

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const mouth = document.getElementById("mouth");
const els = new Map();        // stem -> <video>
let have = new Set();
let showing = null;           // the <video> currently opaque
let activity = "idle";
let z = 1;
let env = 0;                  // smoothed level
let loudSince = 0;
let flourishAt = 0;
let oneShotUntil = 0;
let queuedActivity = null;    // spec 3.6: a non-speaking activity change held until an
                               // in-flight one-shot finishes, rather than dropped or
                               // acted on mid-gesture
let mouthClip = null;         // driving clip stem from /face/manifest; null = no lip-sync
let mouthDead = false;        // the frame stream is not coming back: revert to v1
let mouthShown = false;       // last opacity written, so refreshMouth writes on change
let mouthCtx = null;          // #mouth's 2d context, taken once on the first frame
let mouthQueue = [];          // decoded frames waiting for a slot, oldest first
let mouthDueAt = 0;           // earliest time the next frame may go up (presentMouth)
let mouthSeq = 0;             // frames handed to the decoder, in arrival order
let mouthQueuedSeq = 0;       // highest one that reached the queue, so a decode that
                               // finishes out of order is dropped rather than shown
                               // after the frame that overtook it
let mouthFresh = false;       // a frame has been decoded since the stream opened, so
                               // there is something true to show. No longer cleared per
                               // turn: the daemon drives every clip now and publishes
                               // continuously, so there is no such thing as a frame
                               // belonging to the previous utterance
let driverEpoch = 0;          // page-clock seconds at which the driving clip's playhead
                               // read 0, from /face/manifest - see driverAt()

// --- the driving clip's playhead belongs to the daemon --------------------
// The renderer composites each mouth into the driving frame it believes the page will
// be showing when that JPEG lands (render.py:DISPLAY_LEAD), so "which frame is the page
// showing" is a question with one answer and the daemon owns it. It has to: the answer
// it needs is for a quarter-second in the FUTURE, which only a clock can give, and this
// page has no channel back to ask on anyway.
//
// So the page follows. /face/manifest hands over the clip's position once
// (render.py:ClipClock.position), the page anchors that to its own performance.now(),
// and the <video> free-runs from there. Measured before trusting it: a playing muted
// <video> tracks performance.now() to within 0.002 frames over 8 seconds - flat, not a
// slow ramp - and idle2's `duration` is 8.041667s against 193/24 to the last digit
// either side reports, so the loop wraps in the same place on both. All of the drift
// there is comes from the browser PAUSING the clip (measured: -0.2 to -0.4 frames of
// playhead lost per pause, permanently, and a hidden tab is paused on every loop).
// That is not a case for a rate correction, it is a case for re-seeking wherever a
// pause can have happened - which is show() and ensurePlaying(), both below.
function driverAt() {
  const v = els.get(mouthClip);
  const period = v && v.duration;
  if (!period || !Number.isFinite(period)) return 0;
  const at = (performance.now() / 1000 - driverEpoch) % period;
  return at < 0 ? at + period : at;                // % keeps the sign in JS
}

// Is `stem` the clip the renderer is drawing on right now? The playhead rule above
// applies to that clip and no other: every other clip starts at 0 when it is shown,
// because a clip you are switching TO has no position of its own.
function isDriver(stem) { return mouthReady() && stem === mouthClip; }

// --- lip-sync mouth: is it this page's speaking path, and is it live? -------
// Two questions, not one. `mouthReady` decides which clip plays *under* the crop and
// so must not flicker - a clip switch mid-sentence is worse than a still mouth. Only
// `mouthLive` gates the crop itself, so a gap of a few frames hides the overlay and
// leaves the clip alone, and the page never has to choose between a frozen mouth and
// a clip that changes twice a second.
function mouthReady() { return !!mouthClip && !mouthDead; }
// No staleness clock any more, and not for want of one: the page gets no per-frame
// event to time from. It does not need one - the frames stopping for good is its own
// signal, because the response ends and `onerror` below fires.
//
// `mouthFresh` is now only the first rising edge: an empty canvas must not fade in over
// a clip before there is anything in it. It used to be cleared on every activity change,
// to keep the LAST frame of the previous utterance from dissolving over a live head at
// the start of the next one - a real defect, and one the daemon driving every clip
// removes at the source. Frames arrive continuously and are always of the clip that is
// up, so there is no stale frame to hide from; clearing this per turn would only blink
// the canvas off at each change, which is the flicker this whole task removes.
function mouthLive() { return mouthReady() && mouthFresh; }

// Whether the crop is on screen, recomputed from state and written only on change.
// Deliberately NOT called from tick(): rAF does not merely throttle in a backgrounded
// or occluded window, it stops (measured - see the header note and ensurePlaying), and
// the one thing that must never wait on it is the mouth going AWAY. A frozen crop over
// a clip is the exact failure the fallback exists for, so a frame arriving and a frame
// failing to arrive are both handled where they happen: onmessage, and the timer it
// re-arms. Measured while getting this wrong: with the visibility toggle inside tick(),
// killing the renderer left the overlay stuck mid-fade at opacity 0.13 for good.
function refreshMouth() {
  // Every activity, and no one-shot exception. This is the colour fix finished.
  //
  // Chrome's decode of the untagged mp4 disagrees with its decode of our JPEGs -
  // measured R +3.0, G +2.1, B +1.2 - so any moment this canvas goes on or off, the
  // whole picture shifts darker and off-hue. The first fix published idle as frames too,
  // which closed the idle<->speaking boundary; a real conversation crosses
  // listening->speaking, where the canvas was still off, and the owner saw the shift
  // come back on every turn of a live session. It is closed for good here because the
  // daemon drives every prepared clip, so there is no activity and no mood for which
  // the frames are not the right picture. The <video> underneath is the fallback and
  // nothing else - see mouthDead.
  const on = mouthLive();
  if (on === mouthShown) return;
  mouthShown = on;
  // Single-sided, spec 3.2: only the crop's opacity animates, over a clip that is
  // already fully opaque underneath - in both directions, so neither the fade in nor
  // the fall back to clips can dip to the page background.
  mouth.style.opacity = on ? "1" : "0";
}

function first(list) { return (list || []).find(s => have.has(s)) || null; }

// Whether a clip shown for `act` should loop, or run once and report `ended`.
// Idle is the only activity that ever wanted the latter, and only to drive the
// rotation above: `ended` -> advance() -> a different idle clip. With the rotation
// pinned there is nothing on the other side of that `ended`, so leaving loop off would
// park the face on the driving clip's last frame for good.
function loops(act) { return act !== "idle" || mouthReady(); }

let oneShotIsFlourish = false;  // spec 3.6: a flourish means nothing, so any
                               // activity change cuts it. A mood does not (spec
                               // 3.2) - that is the daemon saying something, and
                               // only speaking may cut it
let pendingWaitTimer = 0;     // task 9 (3rd follow-up): setTimeout handle for a
                               // pending wait-for-next-neutral-moment delay, if any
                               // is outstanding - see neutralWaitMs()/toActivity()
let transitions = null;       // task 9: the pose-match table from /face/transitions,
                               // or null if none was ever built (rule 4: absent means
                               // frame 0, same as today)

function clipFor(act) {
  // While the daemon is driving, it owns this decision for every activity - it
  // composites onto the frame it believes is up, so the page following anything else
  // would put a different head under the mouth. The chains below are the v1 fallback
  // and ADR 0017 still governs them.
  if (mouthReady()) return mouthClip;
  if (act === "idle") {
    // While lip-sync is alive, idle IS the driving clip and does not rotate. The
    // owner's report was that speech "just feels like a different clip starting", and
    // it literally was one: idle picked at random from idle1/idle2/idle3 while
    // speaking could only ever be idle2, so four times in five the first word of a
    // reply swapped the head, the pose and the framing. Returning the same stem here
    // is what makes the handover a no-op that show() declines to crossfade at all.
    //
    // The cost is real and worth stating: idle loses its variety for as long as
    // lip-sync is on. flourish_arms still fires on its own interval and the mood
    // one-shots still play, so it is not one clip forever - but it is one loop
    // between them, where it used to be three. idle2 is the best case for that
    // (movement 4.77 against idle1's 0.46, which is why it was chosen to drive), and
    // the fix for the rest is clip linkage rather than a rotation that lands on the
    // wrong head.
    if (mouthReady()) return mouthClip;
    const pool = IDLES.filter(s => have.has(s));
    if (!pool.length) return null;
    const cur = showing && showing.dataset.stem;
    const pick = pool.filter(s => s !== cur);
    return (pick.length ? pick : pool)[Math.floor(Math.random() * (pick.length ? pick.length : pool.length))];
  }
  if (act === "speaking") {
    // Lip-sync drives ONE clip and the crops are that clip's own pixels frame for
    // frame, so speaking_soft underneath would put a different head around the mouth.
    // The v1 chain below stays live and is what a dead frame stream falls back to.
    if (mouthReady()) return mouthClip;
    const loud = loudSince && performance.now() - loudSince > LOUD_HOLD_MS;
    // spec 3.7: speaking_loud -> speaking_soft -> idle. The first two links are
    // this branch's own ordering; reusing FOR_ACTIVITY[act] for the last link keeps
    // the same shape every other activity already uses to reach idle.
    return first(loud ? ["speaking_loud", "speaking_soft"] : ["speaking_soft"])
      || first(["speaking_loud"])
      || first(FOR_ACTIVITY[act]);
  }
  return first(FOR_ACTIVITY[act]);
}

// --- PRIME: one decoded frame per clip, then hold at zero -------------------
async function prime(stem) {
  const v = document.createElement("video");
  v.src = `/face/clips/${stem}`;
  // Both the IDL property and the content attribute: some WebKit builds only
  // honour the latter, and setting both costs nothing.
  v.muted = true; v.playsInline = true; v.setAttribute("playsinline", "");
  v.preload = "auto"; v.loop = false;
  v.dataset.stem = stem;
  stage.appendChild(v);
  els.set(stem, v);
  await new Promise(res => {
    v.addEventListener("loadeddata", res, { once: true });
    v.addEventListener("error", res, { once: true });
  });
  try { await v.play(); v.pause(); v.currentTime = 0; } catch { /* held at frame 0 */ }
  v.addEventListener("ended", () => { if (v === showing) advance(); });
  // A pause we did not ask for: measured live, Chrome pauses muted background video
  // to save power even in a merely-occluded window, not just a backgrounded one.
  // A paused clip never fires `ended`, so nothing else here would ever notice.
  // `!v.ended`: `pause` fires BEFORE `ended` per the HTML spec, so a clip
  // reaching its own end arrives here looking exactly like a browser-imposed
  // pause - and play() at currentTime == duration restarts it from 0, underneath
  // the crossfade the `ended` listener above is about to start.
  v.addEventListener("pause", () => { if (v === showing && !v.ended) ensurePlaying(); });
}

// --- POSE-MATCHED ENTRY (task 9) --------------------------------------------
// Blending outgoing[t] into incoming[0] reads as a cut because a clip's
// near-neutral pose sits only at its own start and end (measured: median
// distance 6.4, cut to 3.8 by matching pose instead - the table is in
// docs/superpowers/plans/2026-08-25-face-v1.md, Task 9, and the decision it
// led to is docs/adr/0017-the-neutral-moment-not-the-matched-pose.md).
// Look up the frame of `stem` whose pose was measured closest to whatever pose
// `prev` was showing when the switch fired, instead of always seeking to 0.
//
// Rules 3 and 4 collapse into one case here, on purpose: a one-shot
// destination is never a key under any source in transitions.match, because
// daemon/face_match.py builds the table only over LOOP clips (both axes) - so
// "entering a one-shot" and "no table at all" both just miss the lookup and
// fall through to the same 0. No separate one-shot check is needed, and one
// would risk drifting from face_match.py's own ONE_SHOTS list.
function poseMatchTime(prev, stem) {
  if (!transitions || !prev) return 0;
  const seeks = transitions.match?.[prev.dataset.stem]?.[stem];
  if (!seeks || !seeks.length) return 0;
  const bucket = Math.floor(prev.currentTime / transitions.bucket);
  return seeks[Math.min(Math.max(bucket, 0), seeks.length - 1)] ?? 0;
}

// --- WAIT FOR THE NEXT NEAR-NEUTRAL MOMENT (task 9, 3rd follow-up) ---------
// Supersedes the original wait rule (spec 3.2): that rule waited only for the
// outgoing clip's own literal end, within WAIT_MS of it. Measured against
// this page's own scale (face_match.py's own _frames, on the owner's real
// clips), that was solving the wrong problem: near-neutral time is not
// confined to a clip's own end, it is spread through most of the clip, so
// checking only the end rarely found it. `transitions.neutral[stem]` is one
// bool per BUCKET-second slice of `stem`'s own timeline - true where some
// frame in that slice is within face_match.py's own threshold of the clip's
// frame 0 (see NEUTRAL_THRESHOLD_FRACTION there). This looks up whether
// `video` is near neutral right now, and if not, how long until the next
// slice that is - capped at NEUTRAL_WAIT_CAP_MS, since a bucket that never
// arrives is exactly the case pose-matched entry (poseMatchTime, above) still
// covers.
function neutralWaitMs(video) {
  if (!transitions || !video) return null;
  const spans = transitions.neutral?.[video.dataset.stem];
  if (!spans || !spans.length) return null;
  const bucket = transitions.bucket;
  const cur = Math.floor(video.currentTime / bucket) % spans.length;
  if (spans[cur]) return 0;                // already near neutral - no wait needed
  for (let step = 1; step <= spans.length; step++) {
    const idx = (cur + step) % spans.length;    // wraps: the clip loops
    if (spans[idx]) {
      const waitS = step * bucket - (video.currentTime % bucket);
      return Math.min(waitS * 1000, NEUTRAL_WAIT_CAP_MS);
    }
  }
  return null;                             // no near-neutral slice anywhere in this clip
}

function clearPendingWait() {
  if (pendingWaitTimer) {
    clearTimeout(pendingWaitTimer);
    pendingWaitTimer = 0;
  }
}

// --- SINGLE-SIDED CROSSFADE -------------------------------------------------
function show(stem, { loop = true, fadeMs = FADE_MS } = {}) {
  const next = els.get(stem);
  if (!next || next === showing) return;
  const prev = showing;
  next.loop = loop;
  // The pose-matched moment for an ordinary clip (main's own entry policy). The
  // driving clip is the exception and it is not this element's to choose: it is
  // whatever the daemon's clock says (driverAt(), above), because that is the frame
  // every rendered mouth is being composited into. This element has been sitting
  // paused since whatever last took the screen off it, so it is stale by exactly that
  // long, and a stale playhead is a pose the crop was never drawn for.
  next.currentTime = isDriver(stem) ? driverAt() : poseMatchTime(prev, stem);
  next.style.zIndex = String(++z);       // on top, so fading in covers rather than blends
  if (!REDUCED_MOTION) next.style.transitionDuration = `${fadeMs}ms`; // spec 3.2's fast/slow split
  next.playbackRate = 1;
  next.play().then(() => {
    next.style.opacity = "1";
    showing = next;
    if (prev) setTimeout(() => {         // hidden behind an already-opaque layer
      // ...unless it is back in front. Switch away and back inside fadeMs and
      // this stale timer hides the element that is now `showing`, leaving BOTH
      // layers transparent and the page on flat #19191B until something
      // switches to a different element again. Not a rare race: with tools at
      // the default mode=full a read_file round finishes well inside 400ms, so
      // thinking -> working -> thinking blanks the face.
      if (prev === showing) return;
      prev.style.opacity = "0";
      prev.pause();
    }, fadeMs);
  }).catch(() => {
    // Surfaced, not swallowed: silently eating this left `showing` stuck on the old
    // clip forever with nothing retrying (measured live). Recovery is ensurePlaying(),
    // triggered by the next real pause/visibilitychange event, not retried right here
    // - if the browser is withholding playback, an immediate retry fails the same way.
    console.warn(`face: play() rejected for ${stem}`);
  });
}

// --- LIP-SYNC OVERLAY: arrival and presentation are two clocks --------------
// Measured on the assembled stack in a real browser, 120Hz display, and this is the
// whole reason the transport below is not one line of `mouth.src = "/face/frames"`
// any more. An <img> fed multipart/x-mixed-replace repaints whenever a PART ARRIVES,
// and arrival is a socket event: median gap 43.1ms but p90 61.4ms, a quarter of the
// gaps under 25ms and a quarter over 60ms. The average rate was right - 23.8fps on
// screen - and the screen was not. 37.4% of frames changed duration by a whole 17ms
// from the frame before them, and 21% sat there longer than a source frame lasts, up
// to 83ms. The <video> the page plays at idle never exceeded 41.7ms once, 79.3% of
// its frames sitting for exactly one source period. Same rate, different regularity,
// and irregular presentation is what reads as a dropped frame rate - which is exactly
// what the switch into speech was reported as.
//
// So the two clocks are separated: the socket fills a queue, and tick() - which runs
// on the compositor's own clock - puts ONE frame up per MOUTH_PERIOD_MS. Measured the
// same way afterwards, on the same stack: 72.5% of frames on the modal dwell against
// 57.5%, 13.6% of pairs changing duration against 37.4%, the spread of dwell times
// down from 11.4ms to 4.4ms, and the longest a frame sits down from 83ms to 51ms -
// 99.9% of them inside a one-refresh band around the source period. Nothing is
// dropped to get that: 967 of the 968 frames that arrived were drawn.
//
// A simulation over the same arrival stamps said this would land at 82% and 16% and
// that the queue depth below would not matter. Both halves were wrong in the browser
// and the second one badly - see MOUTH_CATCH_UP. The numbers above are the measured
// ones; the simulation is recorded here only because it is the reason the queue is
// shallow and there is no deliberate lead in front of it.

function mouthStream() {
  // fetch, not an <img>: the parts have to be decoded into something this page can
  // choose WHEN to draw, and an <img> draws them itself. Everything the <img> was
  // good at survives - the bytes stay raw (the SSE version this all replaced had to
  // base64 them, +33% on the wire and a quarter-megabyte JS string 24 times a second)
  // and createImageBitmap still decodes off the main thread, so the thread running
  // the crossfades never touches a 180KB JPEG.
  return readFrames().catch((err) => {
    console.warn(`face: the frame stream failed - ${err}`);
  }).finally(() => {
    // The response ending IS the signal, exactly as the <img>'s `error` was: either
    // the renderer latched `failed` and the route closed the stream, or it answered
    // 503. Either way the mouth is not coming back, so clipFor("speaking") goes to
    // speaking_soft and tick() crossfades to it. No reconnect - the fallback is the
    // pre-rendered clips, not a retry loop against a latched failure.
    mouthDead = true;
    while (mouthQueue.length) mouthQueue.shift().close();
    // And idle gets its rotation back, which means the clip on screen has to be able
    // to end again: loops() answers false from here on, but the element it already
    // set `loop` on will never fire `ended` to ask it. Without this line a renderer
    // that died at idle leaves the face on idle2 for the rest of the session - not
    // broken, just quietly stuck on one clip with nothing saying so.
    if (showing && showing.dataset.stem === mouthClip && activity === "idle") {
      showing.loop = false;
    }
    refreshMouth();
  });
}

async function readFrames() {
  const response = await fetch("/face/frames");
  if (!response.ok || !response.body) {
    // Say which of the three reasons it was. /face/frames puts that in the body on
    // purpose and an <img> could never read it, so this failure used to reach the
    // owner as a face that quietly stopped lip-syncing and nothing else.
    const why = await response.text().catch(() => "");
    throw new Error(`HTTP ${response.status}: ${why.trim() || "no reason given"}`);
  }
  const reader = response.body.getReader();
  let buf = new Uint8Array(0);
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    const merged = new Uint8Array(buf.length + value.length);
    merged.set(buf);
    merged.set(value, buf.length);
    buf = merged;
    for (;;) {
      // By the declared Content-Length, never by scanning for the next boundary: a
      // JPEG is binary and may contain the boundary bytes, and a scanner would
      // truncate exactly the frames this exists to show.
      const head = headerEnd(buf);
      if (head < 0) break;
      const length = contentLength(buf, head);
      if (length === null) return;        // the closing boundary; nothing follows it
      if (buf.length < head + 4 + length) break;
      const clip = partClip(buf, head);
      if (clip && clip !== mouthClip) {
        // The daemon moved the clip. Follow it so the <video> underneath is the one the
        // frames are of - it is invisible while the canvas is up, and it is the whole
        // fallback if the frames stop. No fade: the canvas covers it either way, and a
        // crossfade here would only cost a decode.
        mouthClip = clip;
        if (have.has(clip)) show(clip, { loop: loops(activity), fadeMs: 0 });
      }
      decodeFrame(buf.slice(head + 4, head + 4 + length));
      buf = buf.slice(head + 4 + length);
    }
  }
}

function headerEnd(buf) {
  // Only the first 256 bytes: a part's headers are short and always sit at offset 0,
  // because readFrames() drops each part's bytes as it consumes them. Scanning the
  // whole buffer would mean re-walking a 180KB payload on every socket chunk.
  const limit = Math.min(buf.length - 3, 256);
  for (let i = 0; i < limit; i++) {
    if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) {
      return i;
    }
  }
  return -1;
}

function contentLength(buf, head) {
  const found = /content-length:\s*(\d+)/i.exec(
    new TextDecoder().decode(buf.subarray(0, head))
  );
  return found ? Number(found[1]) : null;
}

function partClip(buf, head) {
  // The clip this frame was composited into, off the part's own headers. Travelling
  // with the frame is the point: an activity event and the frames it implies do not
  // arrive together, so a second channel would leave the wrong clip under the canvas
  // for as long as the two disagreed.
  const found = /x-face-clip:\s*([a-z0-9_]+)/i.exec(
    new TextDecoder().decode(buf.subarray(0, head))
  );
  return found ? found[1] : null;
}

function decodeFrame(bytes) {
  const seq = ++mouthSeq;
  createImageBitmap(new Blob([bytes], { type: "image/jpeg" })).then((bitmap) => {
    // Decodes run concurrently, so one can finish after a later one. Showing it then
    // would run the mouth backwards for a frame; dropping it costs 41ms of mouth.
    // Against mouthQueuedSeq, not mouthSeq: mouthSeq has already counted every frame
    // still being decoded, so comparing with it would discard all of them.
    if (seq < mouthQueuedSeq) { bitmap.close(); return; }
    mouthQueuedSeq = seq;
    mouthQueue.push(bitmap);
    while (mouthQueue.length > MOUTH_QUEUE_MAX) mouthQueue.shift().close();
    // This turn's first frame: the overlay may come up now, and not before
    // (mouthLive). Here rather than in presentMouth() so refreshMouth() stays off
    // rAF - a decode callback is a microtask and runs in an occluded window, where
    // rAF has stopped outright. presentMouth draws this one a frame later, at which
    // point the fade is a few percent in, so nothing stale is visible on the way.
    if (!mouthFresh) { mouthFresh = true; refreshMouth(); }
  }).catch(() => { /* a truncated part; the next one is 41ms away */ });
}

// One frame per MOUTH_PERIOD_MS, from tick(), so presentation lands on the
// compositor's clock instead of the socket's. Called from tick() and nowhere else -
// unlike refreshMouth(), which must NOT be, because a frame arriving late is a
// cosmetic lag and the mouth failing to leave is a frozen face.
function presentMouth(now) {
  if (!mouthQueue.length) return;      // nothing new: hold what is already up
  // Wait for the slot, unless frames are piling up - a queue past MOUTH_CATCH_UP means
  // this clock has fallen behind the renderer's, and the way back is to catch up
  // rather than to drop, which is why nothing here throws a frame away.
  if (now < mouthDueAt && mouthQueue.length <= MOUTH_CATCH_UP) return;
  const bitmap = mouthQueue.shift();
  if (mouth.width !== bitmap.width || mouth.height !== bitmap.height) {
    // Assigning either dimension clears the canvas, so only on a real change.
    mouth.width = bitmap.width;
    mouth.height = bitmap.height;
  }
  if (!mouthCtx) mouthCtx = mouth.getContext("2d");
  mouthCtx.drawImage(bitmap, 0, 0);
  bitmap.close();                      // ~7MB each; the GC is too slow to be the plan
  mouthDueAt += MOUTH_PERIOD_MS;
  // A hole in the stream leaves the slot in the past. Re-anchoring rather than
  // letting it catch up is the point: without this the frames buffered during the
  // hole would all go up on consecutive ticks, which is the burst the queue exists
  // to absorb, arriving on screen instead of in the socket.
  if (mouthDueAt < now) mouthDueAt = now + MOUTH_PERIOD_MS;
}

// --- SELF-HEALING PLAYBACK ---------------------------------------------------
function ensurePlaying() {
  // Two independent ways the browser strands the page (both measured live, not
  // theoretical): it can pause an already-showing clip to save power, or it can
  // reject a switch's play() outright, leaving the old clip showing and still
  // playing - just the wrong one. Resuming what's on screen is always correct,
  // so it takes priority; only once it isn't paused do we check whether it's
  // even the right clip for the current activity.
  //
  // A pending neutral-moment wait (pendingWaitTimer) is deliberately left
  // alone here, not pre-empted: toActivity() (below) sets `activity` to the
  // wait's target *before* scheduling its timer, so clipFor(activity) below
  // would already agree with what the wait is waiting for and force an
  // immediate switch out from under it - at the fast fade instead of the
  // wait's own chosen one, and skipping the neutral moment entirely. This is
  // a live path, not a theoretical one: visibilitychange (wired in boot(),
  // below) calls this every time an ambient window is occluded and shown
  // again, which measured live happens constantly.
  if (!showing) return;
  // First, and before the paused check rather than inside it. Every route into this
  // function is a moment the browser may have stopped the clip, and a stopped clip is
  // the ONLY thing measured to move it off the daemon's clock: between pauses a
  // playing <video> holds to performance.now() within 0.002 frames over 8 seconds,
  // while each pause costs 0.2-0.4 frames of playhead that never come back. Doing it
  // only on the paused branch misses the case this was written for - becoming visible
  // after the browser has already resumed on its own - and resuming a clip that is a
  // quarter-second behind the pose the renderer is drawing into is how a backgrounded
  // tab comes back with the mouth on the wrong face. A redundant seek on an already
  // correct clip costs a decode; being wrong costs the thing this page is for.
  if (isDriver(showing.dataset.stem)) showing.currentTime = driverAt();
  if (showing.paused) { showing.play().catch(() => {}); return; }
  if (!oneShotUntil && !pendingWaitTimer) {
    const want = clipFor(activity);
    if (want && want !== showing.dataset.stem) show(want, { loop: loops(activity) });
  }
}

function advance() {
  // A finished clip: one-shots hand back to the activity, idle reshuffles.
  // The pending wait goes first: idle clips are shown with loop:false, so a wait
  // scheduled against the outgoing clip's own timeline outlives that clip ending
  // and would fire up to NEUTRAL_WAIT_CAP_MS later, over whatever this switched to.
  // (The wait is *scheduled* in toActivity(), on its own setTimeout rather than
  // this clip's `ended`, since the neutral moment it waits for is not
  // necessarily the clip's own end - but it still has to be cancelled here.)
  clearPendingWait();
  oneShotUntil = 0;
  oneShotIsFlourish = false;
  refreshMouth();               // the gesture is over; the driving clip may be back
  if (queuedActivity !== null) {
    // spec 3.6: a non-speaking activity change arrived mid-one-shot and was held
    // instead of dropped or applied over the gesture; the one-shot has now
    // actually finished, so apply it. oneShotUntil is already 0 here, so this
    // re-enters toActivity() as a normal (non-queued) transition.
    const act = queuedActivity;
    queuedActivity = null;
    toActivity(act);
    return;
  }
  // Spec 1 wants one every interval for as long as idle lasts, because that is what
  // breaks an 8s loop's period. scheduleFlourish() used to be reachable only from
  // toActivity(), so entering idle armed exactly one: tick() zeroed flourishAt when
  // it fired and nothing ever set it again.
  //
  // `&& !flourishAt` is the whole point of this line and its absence was a *worse*
  // bug than the one above. This runs on every idle clip's `ended`, and an idle clip
  // is about 8s while the wait is tens of seconds - so re-arming unconditionally
  // pushed the deadline further away than time advanced and the flourish could never
  // fire at all. Measured in a live page: flourishAt went 37.3s -> 73.1s while the
  // clock went 7.1s -> 35.7s, chasing a deadline it would never reach.
  //
  // Re-arm only when *disarmed*, which is exactly the two moments that want it:
  // entering idle (toActivity arms it) and just after one fired (tick zeroes it).
  if (activity === "idle" && !flourishAt) scheduleFlourish();
  const stem = clipFor(activity);
  if (stem) show(stem, { loop: loops(activity) });
}

function toActivity(act) {
  if (oneShotUntil && !oneShotIsFlourish && act !== "speaking") {
    // A MOOD in flight (spec 3.2): only a transition to speaking may cut it - the
    // mouth cannot lag the audio, and idle/listening/thinking/working have no such
    // claim over something the daemon is actually saying. Remember it instead;
    // advance() (above) applies it once the one-shot's own `ended` fires.
    //
    // A FLOURISH goes the other way (spec 3.6): decoration with no trigger and no
    // meaning, so any activity change cuts it rather than holding `listening`
    // behind six seconds of gesture nobody asked for. The two spec sections
    // contradicted each other on this and this page used to cite 3.6 for the
    // opposite of what 3.6 says; both now say this split.
    //
    // It also settles the wait/one-shot interaction: a one-shot already in flight
    // blocks a *new* wait from starting here (this check runs first), and
    // playOneShot() (below) always clears a pending wait, so a one-shot always
    // wins over a wait that was already pending.
    queuedActivity = act;
    return;
  }
  queuedActivity = null;
  activity = act;
  oneShotUntil = 0;
  oneShotIsFlourish = false;
  clearPendingWait();           // any earlier deferred wait is moot now
  scheduleFlourish();
  // The queue is still dropped at a turn boundary - an ImageBitmap is ~7MB and a frame
  // for a sentence that has finished is never wanted again - but `mouthFresh` is NOT
  // cleared with it any more. Clearing it took the canvas off screen until the next
  // frame decoded, which with the daemon driving every clip is a blink at every
  // activity change rather than protection from a stale pose. See mouthLive().
  while (mouthQueue.length) mouthQueue.shift().close();
  const fadeMs = SLOW_FADE_ACTIVITIES.has(act) ? FADE_SLOW_MS : FADE_MS;
  const stem = clipFor(act);
  if (!stem) return;
  // !showing.paused excludes a clip that has already reached its end (paused,
  // non-looping - e.g. a one-shot whose `ended` just fired and landed us here via
  // advance()'s queuedActivity branch, above): it will never move again, so
  // waiting on it would strand the page on a frozen last frame.
  if (WAIT_ACTIVITIES.has(act) && showing && !showing.paused) {
    const waitMs = neutralWaitMs(showing);
    if (waitMs > 0) {
      // Keep playing (and looping) toward that moment; the switch itself still
      // goes through show(), so it still looks up the pose-matched entry point
      // (poseMatchTime) for wherever the outgoing clip actually is when this
      // fires - exactly on time if a neutral moment was reached, or wherever
      // NEUTRAL_WAIT_CAP_MS ran out if it timed out first.
      pendingWaitTimer = setTimeout(() => {
        pendingWaitTimer = 0;
        show(stem, { loop: loops(act), fadeMs });
      }, waitMs);
      return;
    }
  }
  show(stem, { loop: loops(act), fadeMs });
}

function playOneShot(stem, { flourish = false } = {}) {
  if (!have.has(stem)) return;           // no clip, no expression - never substitute idle
  // While the daemon is driving, the gesture is ITS clip to play: it queues the mood to
  // the current clip's own end and the frames arrive already composited onto it, with
  // the header moving `mouthClip` when they do. Playing it here as well would put a
  // second, unsynchronised copy of the same expression under the canvas.
  if (mouthReady()) return;
  oneShotUntil = Infinity;
  oneShotIsFlourish = flourish;  // see toActivity(): only a flourish yields to an
                                 // activity change
  clearPendingWait();            // a fresh one-shot supersedes any pending wait
  refreshMouth();                // a mood gesture is not the driving clip: a crop cut
                                 // from idle2 over `amused` is somebody else's mouth
  show(stem, { loop: false });
}

// --- what the envelope actually does, for spec open question 3 --------------
let envSamples = [];
function logEnvelope() {
  // One line per speaking turn: enough to answer "does the envelope ever reach
  // a high band at all", which is what decides both LOUD_ENTER and whether
  // speaking_loud earns its place. Two samples is not a distribution.
  if (envSamples.length < 2) { envSamples = []; return; }
  const s = envSamples.slice().sort((a, b) => a - b);
  const at = q => s[Math.min(s.length - 1, Math.floor(q * s.length))];
  console.log(
    `face: envelope over ${s.length} ticks - min ${at(0).toFixed(3)}, ` +
    `median ${at(0.5).toFixed(3)}, p90 ${at(0.9).toFixed(3)}, ` +
    `max ${s[s.length - 1].toFixed(3)} (LOUD_ENTER ${LOUD_ENTER})`);
  envSamples = [];
}

function scheduleFlourish() {
  flourishAt = activity === "idle"
    ? performance.now() + FLOURISH_MIN_MS + Math.random() * (FLOURISH_MAX_MS - FLOURISH_MIN_MS)
    : 0;
}

// --- mouth: envelope -> playbackRate ---------------------------------------
function tick(now) {
  // Re-armed FIRST, so nothing below can end the loop. It used to be re-armed last,
  // which was safe while the body only nudged playbackRate; presentMouth() draws a
  // decoded bitmap, and a single throw there would have left a page that looks alive,
  // never crossfades again and never runs another flourish - permanently frozen, with
  // no error anyone would go looking for.
  presentMouth(now);          // early, so the draw has the whole frame budget ahead
  if (showing && activity === "speaking") {
    // 1.0x while lip-sync drives the clip. The crops are frame-for-frame that clip's
    // own pixels, so modulating its rate slides the pose under the crop away from the
    // pose the renderer composited into it - v1's envelope IS the mouth, and here it
    // would be the seam. Pinned rather than skipped so a fallback to speaking_soft
    // does not inherit whatever rate the driving clip was left on.
    const rate = mouthReady() ? 1 : RATE_MIN + (RATE_MAX - RATE_MIN) * env;
    if (Math.abs(showing.playbackRate - rate) > 0.01) showing.playbackRate = rate;
    const want = clipFor("speaking");
    if (want && showing.dataset.stem !== want && !oneShotUntil) show(want);
  }
  if (flourishAt && performance.now() > flourishAt && activity === "idle") {
    flourishAt = 0;
    const f = FLOURISHES.filter(s => have.has(s));
    if (f.length) playOneShot(f[Math.floor(Math.random() * f.length)], { flourish: true });
  }
  requestAnimationFrame(tick);
}

// --- wire ------------------------------------------------------------------
async function boot() {
  const manifest = await fetch("/face/manifest").then(r => r.json()).catch(() => ({ clips: [] }));
  // Stamped HERE, before the transitions fetch and before priming: `lipsync.position`
  // is the clip's playhead at the moment the daemon built THAT response, and both of
  // those take time - priming a dozen clips is hundreds of milliseconds. Anchoring
  // after them would put the page that far behind the pose every rendered frame is
  // drawn into.
  const manifestAt = performance.now() / 1000;
  have = new Set(manifest.clips);
  // 404 (no table built yet) and a network hiccup both leave transitions null,
  // which poseMatchTime() already treats as "fall back to frame 0" (rule 4).
  transitions = await fetch("/face/transitions").then(r => r.ok ? r.json() : null).catch(() => null);
  // Two hints, because a partial set is supposed to work (spec 3.7) and one of
  // its shapes did not: with clips present but no idle clip, boot's own
  // toActivity("idle") has nothing to show and the page rendered flat #19191B
  // with no explanation at all. The hint sits behind every <video> (they carry a
  // z-index, it does not), so whatever the set DOES have still covers it the
  // moment the daemon does something.
  const noIdle = have.size > 0 && !clipFor("idle");
  if (!have.size || noIdle) {
    hint.hidden = false;
    hint.innerHTML = noIdle
      ? "No idle clip. Add <code>idle1</code>, <code>idle2</code> or <code>idle3</code> " +
        "to <code>&lt;data_dir&gt;/face/</code> &mdash; the rest of the set still plays."
      : "No clips yet. Put them in <code>&lt;data_dir&gt;/face/</code> " +
        "&mdash; see <code>docs/superpowers/specs/2026-08-25-face-design.md</code> §4.";
    if (!have.size) return;
  }
  await Promise.all([...have].map(prime));
  // Lip-sync, if the daemon says so. The manifest answers `false` for all three ways
  // there is no mouth - switch off, no renderer wired, renderer latched failed - so
  // the page never has to infer it from a failed request, and a driving clip whose
  // bytes are missing or undecodable is a fourth (videoWidth stays 0 and there is
  // nothing to lay the crop over). Any of them leaves v1 running, untouched.
  const ls = manifest.lipsync;
  const driver = ls && els.get(ls.clip);
  if (ls && driver && driver.videoWidth) {
    mouthClip = ls.clip;
    // The one handover of the daemon's clip clock, and everything downstream of it -
    // which frame every mouth is composited into, and therefore whether the pose under
    // the overlay is the pose the crop was drawn for - is measured from here.
    driverEpoch = manifestAt - (ls.position || 0);
    mouthStream();
  }

  toActivity("idle");
  requestAnimationFrame(tick);

  const es = new EventSource("/face/stream");   // reconnects on its own
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.kind === "shot") { playOneShot(e.clip); return; }
    // `queuedActivity ?? activity`: while a mood one-shot holds a change,
    // `activity` still names the one before it, so comparing against `activity`
    // alone let a change back and forth during the one-shot apply the stale half
    // of it afterwards.
    const cur = queuedActivity ?? activity;
    if (e.activity !== cur) toActivity(e.activity);
    const target = e.activity === "speaking" ? e.level : 0;
    env += (target - env) * (target > env ? ATTACK : RELEASE);
    // On `env`, not `e.level`: see LOUD_ENTER's own note above.
    if (env >= LOUD_ENTER) { if (!loudSince) loudSince = performance.now(); }
    else loudSince = 0;
    if (e.activity === "speaking") envSamples.push(env);
    else logEnvelope();
  };

  // The other half of self-healing: becoming visible again is exactly when the
  // browser will actually let a previously-withheld play() succeed.
  document.addEventListener("visibilitychange", () => {
    // refreshMouth too: rAF stopped while hidden, so the clip under the crop may be
    // the wrong one and the crop itself may be a frame from before the tab was hidden.
    if (document.visibilityState === "visible") { ensurePlaying(); refreshMouth(); }
  });
}

boot();
</script>
