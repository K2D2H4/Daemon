<!doctype html>
<meta charset="utf-8">
<title>face</title>
<!--
  Self-contained, offline, one file - the same posture as the admin shell. It talks to
  four routes on its own origin and loads nothing else.

  Two mouths, and only one of them is here. v1's is this file's own: a speaking clip
  whose playbackRate follows the level (spec 3.4), which cannot make a phoneme. The
  other is rendered by the daemon and arrives on /face/frames as one crop box per
  video frame, laid back over the clip it was cut from. It is off by default, and
  everything below treats it as an overlay that can vanish mid-sentence rather than as
  a mode the page switches into - see mouthReady/mouthLive.

  Three details here are the whole difference between "alive" and "wrong", and all
  three were learned by getting them wrong first:

  1. PRIMING. Every clip is play-then-paused once on load so a decoded frame exists.
     Without it the first switch to a cold clip flashes the page background.
  2. SINGLE-SIDED CROSSFADE. Only the incoming element's opacity animates, on top,
     while the outgoing one stays fully opaque underneath until the fade finishes.
     Fading both at once leaves a moment where neither is opaque, the background shows
     through, and the brightness dips - which reads worse than a hard cut.
  3. NO rAF TIMEKEEPING. <video> playback is native, unlike requestAnimationFrame,
     which throttles in a backgrounded window - rAF only nudges playbackRate, so
     being throttled makes it update less often rather than drift. Native playback
     is not immune to the browser either, though (spec 3.8 claimed it was, and that
     was wrong): Chrome pauses muted background video to save power even in a
     merely-occluded window, measured live - see ensurePlaying(), below.
     And "throttles" is generous: in an occluded window rAF stops outright, measured
     while building the lip-sync overlay. Anything whose LATENESS is a defect rather
     than a cosmetic lag therefore cannot live in tick() - see refreshMouth().
     The lip-synced frames themselves DO present from tick(), and that is not a
     contradiction: a late frame there is a cosmetic lag over a window nobody is
     looking at, and rAF stopping only holds the last frame that was already up.
     What must never wait on rAF is the mouth going AWAY, which is still
     event-driven. See presentMouth() and refreshMouth(), which are separate for
     exactly this reason.
-->
<style>
  :root { --bg: #19191B; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* z-index 0 makes #stage a stacking context, which is the only way #mouth stays
     above every clip: show() hands the incoming clip ++z, so a fixed number on a
     sibling would eventually lose the race. Contained here, it never can. */
  #stage { position: fixed; inset: 0; z-index: 0; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 180ms linear;
  }
  /* The lip-synced face: the WHOLE composited frame, same geometry as the clips it
     replaces, so there is nothing to position and nothing to line up. Two earlier
     versions of this laid a crop of the mouth over the playing clip and both drew a
     visible rectangle - a JPEG has no alpha, so its edge is hard however small it is,
     and the clip underneath is never on the frame the renderer drew.
     A <canvas>, not an <img>, for the reason presentMouth() gives - and object-fit
     applies to it identically (verified in Chrome: a 1080x1620 canvas letterboxes
     into a 900x1000 box at 666px wide, against 667px of arithmetic), so this is the
     same geometry the <img> had and there is still nothing to line up. */
  #mouth {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 180ms linear;
    z-index: 1; pointer-events: none;
  }
  #hint {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem;
    color: #8a8a90; font: 13px/1.7 -apple-system, system-ui, sans-serif;
    text-align: center; z-index: 2;
  }
  #hint code { color: #d8d8dc; }
  @media (prefers-reduced-motion: reduce) {
    video, #mouth { transition: none; }
  }
</style>

<div id="stage"></div>
<canvas id="mouth"></canvas>
<div id="hint" hidden></div>

<script>
"use strict";

const FADE_MS = 180;          // spec 3.2 - fast fade: speaking's mouth-snap and mood
                               // one-shots, where immediacy matters more than smoothness
const FADE_SLOW_MS = 400;     // spec 3.2 - listening/thinking/working and the idle
                               // return, where nothing is urgent and a mismatched pose
                               // needs longer to read as deliberate rather than a cut.
                               // A starting value, not a measured one: 180ms measurably
                               // read as a cut on a real window, and only the owner's
                               // eye against a real window can settle where this lands.
const WAIT_MS = 500;          // spec 3.2's wait window, generalised beyond idle to
                               // every non-urgent activity (listening/thinking/working
                               // too). Measured, and worth saying plainly: near-neutral
                               // windows sit almost entirely at a clip's own start/end
                               // (see the report), so this only helps when the arrival
                               // happens to land in that narrow slice. Nearly free, so
                               // worth doing - NOT a fix for a clip that strays far from
                               // neutral for most of its length (flourish_arms worst:
                               // near neutral only 18% of the time).
const RATE_MIN = 0.85;        // below ~0.8 reads as slow motion
const RATE_MAX = 1.25;        // above ~1.3 reads as fast-forward
const ATTACK = 0.30;          // fast open
const RELEASE = 0.06;         // slow close - real mouths are asymmetric
const IDLES = ["idle1", "idle2", "idle3"];
const FLOURISHES = ["flourish_arms"];
const FLOURISH_MIN_MS = 40000, FLOURISH_MAX_MS = 120000;
const LOUD_ENTER = 0.62, LOUD_HOLD_MS = 500;
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOUTH_STALE_MS = 250;   // How long the last lip-sync frame stays believable.
                               // Frames arrive every 41.67ms, but a gap of a tick or
                               // two is normal, not broken: a model step covers two
                               // frames and cannot start until the second one's audio
                               // has arrived, so the renderer answers "not yet" on
                               // some ticks by design (/face/frames). Six frames
                               // clears that; much longer and a renderer that latched
                               // failed mid-sentence reads as a frozen face, which is
                               // the exact thing the fallback exists to prevent.
const MOUTH_PERIOD_MS = 1000 / 24;  // The renderer's own frame period, and so the rate
                               // presentMouth() puts frames up at. NOT a running
                               // estimate of the rate they ARRIVE at: they arrive at
                               // 23.5-24.0fps and wander, and a clock that chased that
                               // came out worse (65.4% of frames on the modal dwell
                               // against 81.7% - simulated over real arrival stamps,
                               // so treat the gap as the finding and not the figures).
                               // The reason is not about the source at all: 41.67ms is
                               // a whole number of refreshes at 120Hz and 2.5 at 60Hz,
                               // and either repeating pattern reads better than a
                               // period that beats against the display.
const MOUTH_CATCH_UP = 2;     // Queue depth presentMouth() will hold before it stops
                               // waiting for the slot and presents on every tick until
                               // it is level again. Measured, and the difference
                               // between a fix and half of one. At 1, a burst of two
                               // frames inside one slot forced the second out early
                               // immediately - 42% of frames went up ahead of their
                               // slot, and the page landed at 51% on the modal dwell
                               // with 25% of pairs changing duration and a worst dwell
                               // of 82ms, barely better than the <img> it replaced. At
                               // 2 a burst pair is absorbed and only a real backlog
                               // moves the clock: 72.5%, 13.6%, and 51ms.
                               // Holding an early frame is not added lag, it is the
                               // correction: the renderer draws for AUDIBLE time, so a
                               // frame that arrived early is a frame that would have
                               // led the sound. 3 was tried and the run was void - the
                               // machine was loaded and the renderer itself fell to
                               // 15fps - so 2 is where the evidence actually reaches.
const MOUTH_QUEUE_MAX = 4;    // Decoded frames held at once. A bound, not a buffer:
                               // presentMouth() drains one per period and the queue
                               // sits around MOUTH_CATCH_UP, but rAF STOPS in an
                               // occluded window while the socket keeps delivering,
                               // and an ImageBitmap of a 1080x1620 frame is ~7MB.
                               // Four caps that at 28MB.

// activity -> clip, with the fallback chain from spec §3.7 applied at load time.
const FOR_ACTIVITY = {
  idle: IDLES,
  listening: ["listening", "idle1"],
  thinking: ["thinking", "idle1"],
  working: ["working", "thinking", "idle1"],
  speaking: ["speaking_soft", "idle1"],
};

// Which activities get the slow fade (spec 3.2). speaking is deliberately absent:
// its mouth-snap, and the mood one-shots in playOneShot() below, keep FADE_MS.
const SLOW_FADE_ACTIVITIES = new Set(["listening", "thinking", "working", "idle"]);

// Which activities may wait (spec 3.2, generalised beyond idle) for the outgoing
// clip's own loop end before cutting. Same membership as SLOW_FADE_ACTIVITIES
// today - kept as its own constant because fade speed and wait eligibility are
// separate questions that happen to share an answer, not one concern with two names.
const WAIT_ACTIVITIES = new Set(["listening", "thinking", "working", "idle"]);

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const mouth = document.getElementById("mouth");
const els = new Map();        // stem -> <video>
let have = new Set();
let showing = null;           // the <video> currently opaque
let activity = "idle";
let z = 1;
let env = 0;                  // smoothed level
let loudSince = 0;
let flourishAt = 0;
let oneShotUntil = 0;
let pendingWaitFade = 0;      // set only while waiting out spec 3.2's WAIT_MS delay
let queuedActivity = null;    // spec 3.6: a non-speaking activity change held until an
                               // in-flight one-shot finishes, rather than dropped or
                               // acted on mid-gesture
let mouthClip = null;         // driving clip stem from /face/manifest; null = no lip-sync
let mouthDead = false;        // the frame stream is not coming back: revert to v1
let mouthShown = false;       // last opacity written, so refreshMouth writes on change
let mouthCtx = null;          // #mouth's 2d context, taken once on the first frame
let mouthQueue = [];          // decoded frames waiting for a slot, oldest first
let mouthDueAt = 0;           // earliest time the next frame may go up (presentMouth)
let mouthSeq = 0;             // frames handed to the decoder, in arrival order
let mouthQueuedSeq = 0;       // highest one that reached the queue, so a decode that
                               // finishes out of order is dropped rather than shown
                               // after the frame that overtook it

// --- lip-sync mouth: is it this page's speaking path, and is it live? -------
// Two questions, not one. `mouthReady` decides which clip plays *under* the crop and
// so must not flicker - a clip switch mid-sentence is worse than a still mouth. Only
// `mouthLive` gates the crop itself, so a gap of a few frames hides the overlay and
// leaves the clip alone, and the page never has to choose between a frozen mouth and
// a clip that changes twice a second.
function mouthReady() { return !!mouthClip && !mouthDead; }
// No staleness clock any more, and not for want of one: an <img> fed
// multipart/x-mixed-replace gives the page no per-frame event to time from (Chrome
// fires `load` once for the whole stream). It does not need one - `refreshMouth`
// already gates on `activity === "speaking"`, which the activity stream delivers, and
// the renderer only draws while speaking. The frames stopping for good is a separate
// signal: the response ends and `onerror` below fires.
function mouthLive() { return mouthReady(); }

// Whether the crop is on screen, recomputed from state and written only on change.
// Deliberately NOT called from tick(): rAF does not merely throttle in a backgrounded
// or occluded window, it stops (measured - see the header note and ensurePlaying), and
// the one thing that must never wait on it is the mouth going AWAY. A frozen crop over
// a clip is the exact failure the fallback exists for, so a frame arriving and a frame
// failing to arrive are both handled where they happen: onmessage, and the timer it
// re-arms. Measured while getting this wrong: with the visibility toggle inside tick(),
// killing the renderer left the overlay stuck mid-fade at opacity 0.13 for good.
function refreshMouth() {
  const on = activity === "speaking" && !oneShotUntil && mouthLive();
  if (on === mouthShown) return;
  mouthShown = on;
  // Single-sided, spec 3.2: only the crop's opacity animates, over a clip that is
  // already fully opaque underneath - in both directions, so neither the fade in nor
  // the fall back to clips can dip to the page background.
  mouth.style.opacity = on ? "1" : "0";
}

function first(list) { return (list || []).find(s => have.has(s)) || null; }

function clipFor(act) {
  if (act === "idle") {
    const pool = IDLES.filter(s => have.has(s));
    if (!pool.length) return null;
    const cur = showing && showing.dataset.stem;
    const pick = pool.filter(s => s !== cur);
    return (pick.length ? pick : pool)[Math.floor(Math.random() * (pick.length ? pick.length : pool.length))];
  }
  if (act === "speaking") {
    // Lip-sync drives ONE clip and the crops are that clip's own pixels frame for
    // frame, so speaking_soft underneath would put a different head around the mouth.
    // The v1 chain below stays live and is what a dead frame stream falls back to.
    if (mouthReady()) return mouthClip;
    const loud = loudSince && performance.now() - loudSince > LOUD_HOLD_MS;
    // spec 3.7: speaking_loud -> speaking_soft -> idle. The first two links are
    // this branch's own ordering; reusing FOR_ACTIVITY[act] for the last link keeps
    // the same shape every other activity already uses to reach idle.
    return first(loud ? ["speaking_loud", "speaking_soft"] : ["speaking_soft"])
      || first(["speaking_loud"])
      || first(FOR_ACTIVITY[act]);
  }
  return first(FOR_ACTIVITY[act]);
}

// --- PRIME: one decoded frame per clip, then hold at zero -------------------
async function prime(stem) {
  const v = document.createElement("video");
  v.src = `/face/clips/${stem}`;
  // Both the IDL property and the content attribute: some WebKit builds only
  // honour the latter, and setting both costs nothing.
  v.muted = true; v.playsInline = true; v.setAttribute("playsinline", "");
  v.preload = "auto"; v.loop = false;
  v.dataset.stem = stem;
  stage.appendChild(v);
  els.set(stem, v);
  await new Promise(res => {
    v.addEventListener("loadeddata", res, { once: true });
    v.addEventListener("error", res, { once: true });
  });
  try { await v.play(); v.pause(); v.currentTime = 0; } catch { /* held at frame 0 */ }
  v.addEventListener("ended", () => { if (v === showing) advance(); });
  // A pause we did not ask for: measured live, Chrome pauses muted background video
  // to save power even in a merely-occluded window, not just a backgrounded one.
  // A paused clip never fires `ended`, so nothing else here would ever notice.
  v.addEventListener("pause", () => { if (v === showing) ensurePlaying(); });
}

// --- SINGLE-SIDED CROSSFADE -------------------------------------------------
function show(stem, { loop = true, fadeMs = FADE_MS } = {}) {
  const next = els.get(stem);
  if (!next || next === showing) return;
  const prev = showing;
  next.loop = loop;
  next.currentTime = 0;
  next.style.zIndex = String(++z);       // on top, so fading in covers rather than blends
  if (!REDUCED_MOTION) next.style.transitionDuration = `${fadeMs}ms`; // spec 3.2's fast/slow split
  next.playbackRate = 1;
  next.play().then(() => {
    next.style.opacity = "1";
    showing = next;
    if (prev) setTimeout(() => {         // hidden behind an already-opaque layer
      prev.style.opacity = "0";
      prev.pause();
    }, fadeMs);
  }).catch(() => {
    // Surfaced, not swallowed: silently eating this left `showing` stuck on the old
    // clip forever with nothing retrying (measured live). Recovery is ensurePlaying(),
    // triggered by the next real pause/visibilitychange event, not retried right here
    // - if the browser is withholding playback, an immediate retry fails the same way.
    console.warn(`face: play() rejected for ${stem}`);
  });
}

// --- LIP-SYNC OVERLAY: arrival and presentation are two clocks --------------
// Measured on the assembled stack in a real browser, 120Hz display, and this is the
// whole reason the transport below is not one line of `mouth.src = "/face/frames"`
// any more. An <img> fed multipart/x-mixed-replace repaints whenever a PART ARRIVES,
// and arrival is a socket event: median gap 43.1ms but p90 61.4ms, a quarter of the
// gaps under 25ms and a quarter over 60ms. The average rate was right - 23.8fps on
// screen - and the screen was not. 37.4% of frames changed duration by a whole 17ms
// from the frame before them, and 21% sat there longer than a source frame lasts, up
// to 83ms. The <video> the page plays at idle never exceeded 41.7ms once, 79.3% of
// its frames sitting for exactly one source period. Same rate, different regularity,
// and irregular presentation is what reads as a dropped frame rate - which is exactly
// what the switch into speech was reported as.
//
// So the two clocks are separated: the socket fills a queue, and tick() - which runs
// on the compositor's own clock - puts ONE frame up per MOUTH_PERIOD_MS. Measured the
// same way afterwards, on the same stack: 72.5% of frames on the modal dwell against
// 57.5%, 13.6% of pairs changing duration against 37.4%, the spread of dwell times
// down from 11.4ms to 4.4ms, and the longest a frame sits down from 83ms to 51ms -
// 99.9% of them inside a one-refresh band around the source period. Nothing is
// dropped to get that: 967 of the 968 frames that arrived were drawn.
//
// A simulation over the same arrival stamps said this would land at 82% and 16% and
// that the queue depth below would not matter. Both halves were wrong in the browser
// and the second one badly - see MOUTH_CATCH_UP. The numbers above are the measured
// ones; the simulation is recorded here only because it is the reason the queue is
// shallow and there is no deliberate lead in front of it.

function mouthStream() {
  // fetch, not an <img>: the parts have to be decoded into something this page can
  // choose WHEN to draw, and an <img> draws them itself. Everything the <img> was
  // good at survives - the bytes stay raw (the SSE version this all replaced had to
  // base64 them, +33% on the wire and a quarter-megabyte JS string 24 times a second)
  // and createImageBitmap still decodes off the main thread, so the thread running
  // the crossfades never touches a 180KB JPEG.
  return readFrames().catch((err) => {
    console.warn(`face: the frame stream failed - ${err}`);
  }).finally(() => {
    // The response ending IS the signal, exactly as the <img>'s `error` was: either
    // the renderer latched `failed` and the route closed the stream, or it answered
    // 503. Either way the mouth is not coming back, so clipFor("speaking") goes to
    // speaking_soft and tick() crossfades to it. No reconnect - the fallback is the
    // pre-rendered clips, not a retry loop against a latched failure.
    mouthDead = true;
    while (mouthQueue.length) mouthQueue.shift().close();
    refreshMouth();
  });
}

async function readFrames() {
  const response = await fetch("/face/frames");
  if (!response.ok || !response.body) {
    // Say which of the three reasons it was. /face/frames puts that in the body on
    // purpose and an <img> could never read it, so this failure used to reach the
    // owner as a face that quietly stopped lip-syncing and nothing else.
    const why = await response.text().catch(() => "");
    throw new Error(`HTTP ${response.status}: ${why.trim() || "no reason given"}`);
  }
  const reader = response.body.getReader();
  let buf = new Uint8Array(0);
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    const merged = new Uint8Array(buf.length + value.length);
    merged.set(buf);
    merged.set(value, buf.length);
    buf = merged;
    for (;;) {
      // By the declared Content-Length, never by scanning for the next boundary: a
      // JPEG is binary and may contain the boundary bytes, and a scanner would
      // truncate exactly the frames this exists to show.
      const head = headerEnd(buf);
      if (head < 0) break;
      const length = contentLength(buf, head);
      if (length === null) return;        // the closing boundary; nothing follows it
      if (buf.length < head + 4 + length) break;
      decodeFrame(buf.slice(head + 4, head + 4 + length));
      buf = buf.slice(head + 4 + length);
    }
  }
}

function headerEnd(buf) {
  // Only the first 256 bytes: a part's headers are short and always sit at offset 0,
  // because readFrames() drops each part's bytes as it consumes them. Scanning the
  // whole buffer would mean re-walking a 180KB payload on every socket chunk.
  const limit = Math.min(buf.length - 3, 256);
  for (let i = 0; i < limit; i++) {
    if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) {
      return i;
    }
  }
  return -1;
}

function contentLength(buf, head) {
  const found = /content-length:\s*(\d+)/i.exec(
    new TextDecoder().decode(buf.subarray(0, head))
  );
  return found ? Number(found[1]) : null;
}

function decodeFrame(bytes) {
  const seq = ++mouthSeq;
  createImageBitmap(new Blob([bytes], { type: "image/jpeg" })).then((bitmap) => {
    // Decodes run concurrently, so one can finish after a later one. Showing it then
    // would run the mouth backwards for a frame; dropping it costs 41ms of mouth.
    // Against mouthQueuedSeq, not mouthSeq: mouthSeq has already counted every frame
    // still being decoded, so comparing with it would discard all of them.
    if (seq < mouthQueuedSeq) { bitmap.close(); return; }
    mouthQueuedSeq = seq;
    mouthQueue.push(bitmap);
    while (mouthQueue.length > MOUTH_QUEUE_MAX) mouthQueue.shift().close();
  }).catch(() => { /* a truncated part; the next one is 41ms away */ });
}

// One frame per MOUTH_PERIOD_MS, from tick(), so presentation lands on the
// compositor's clock instead of the socket's. Called from tick() and nowhere else -
// unlike refreshMouth(), which must NOT be, because a frame arriving late is a
// cosmetic lag and the mouth failing to leave is a frozen face.
function presentMouth(now) {
  if (!mouthQueue.length) return;      // nothing new: hold what is already up
  // Wait for the slot, unless frames are piling up - a queue past MOUTH_CATCH_UP means
  // this clock has fallen behind the renderer's, and the way back is to catch up
  // rather than to drop, which is why nothing here throws a frame away.
  if (now < mouthDueAt && mouthQueue.length <= MOUTH_CATCH_UP) return;
  const bitmap = mouthQueue.shift();
  if (mouth.width !== bitmap.width || mouth.height !== bitmap.height) {
    // Assigning either dimension clears the canvas, so only on a real change.
    mouth.width = bitmap.width;
    mouth.height = bitmap.height;
  }
  if (!mouthCtx) mouthCtx = mouth.getContext("2d");
  mouthCtx.drawImage(bitmap, 0, 0);
  bitmap.close();                      // ~7MB each; the GC is too slow to be the plan
  mouthDueAt += MOUTH_PERIOD_MS;
  // A hole in the stream leaves the slot in the past. Re-anchoring rather than
  // letting it catch up is the point: without this the frames buffered during the
  // hole would all go up on consecutive ticks, which is the burst the queue exists
  // to absorb, arriving on screen instead of in the socket.
  if (mouthDueAt < now) mouthDueAt = now + MOUTH_PERIOD_MS;
}

// --- SELF-HEALING PLAYBACK ---------------------------------------------------
function ensurePlaying() {
  // Two independent ways the browser strands the page (both measured live, not
  // theoretical): it can pause an already-showing clip to save power, or it can
  // reject a switch's play() outright, leaving the old clip showing and still
  // playing - just the wrong one. Resuming what's on screen is always correct,
  // including mid a pending WAIT_MS wait (that clip just needs to keep running
  // toward its own end), so it takes priority; only once it isn't paused do we
  // check whether it's even the right clip for the current activity.
  if (!showing) return;
  if (showing.paused) { showing.play().catch(() => {}); return; }
  if (!oneShotUntil) {
    const want = clipFor(activity);
    if (want && want !== showing.dataset.stem) show(want, { loop: activity !== "idle" });
  }
}

function advance() {
  // A finished clip: one-shots hand back to the activity, idle reshuffles. A
  // deferred wait (toActivity, below) also lands here once the outgoing clip
  // reaches its own end, carrying the fade speed that call already chose.
  oneShotUntil = 0;
  refreshMouth();               // the gesture is over; the driving clip may be back
  if (queuedActivity !== null) {
    // spec 3.6: a non-speaking activity change arrived mid-one-shot and was held
    // instead of dropped or applied over the gesture; the one-shot has now
    // actually finished, so apply it. oneShotUntil is already 0 here, so this
    // re-enters toActivity() as a normal (non-queued) transition.
    const act = queuedActivity;
    queuedActivity = null;
    toActivity(act);
    return;
  }
  const fadeMs = pendingWaitFade || FADE_MS;
  pendingWaitFade = 0;
  const stem = clipFor(activity);
  if (stem) show(stem, { loop: activity !== "idle", fadeMs });
}

function toActivity(act) {
  if (oneShotUntil && act !== "speaking") {
    // spec 3.6: only a transition to speaking may cut an in-flight one-shot - the
    // mouth cannot lag the audio, but idle/listening/thinking/working have no such
    // claim. Remember it instead; advance() (above) applies it once the one-shot's
    // own `ended` fires. This also settles the wait/one-shot interaction: a
    // one-shot already in flight blocks a *new* wait from starting here (this
    // check runs first), and playOneShot() (below) always clears pendingWaitFade,
    // so a one-shot always wins over a wait that was already pending.
    queuedActivity = act;
    return;
  }
  queuedActivity = null;
  activity = act;
  oneShotUntil = 0;
  pendingWaitFade = 0;          // any earlier deferred wait is moot now
  scheduleFlourish();
  refreshMouth();               // leaving speaking takes the crop off the screen, and
                                 // arriving at it puts one back if frames are current
  const fadeMs = SLOW_FADE_ACTIVITIES.has(act) ? FADE_SLOW_MS : FADE_MS;
  // !showing.paused excludes a clip that has already reached its end (paused,
  // non-looping - e.g. a one-shot whose `ended` just fired and landed us here via
  // advance()'s queuedActivity branch, above): it will never fire `ended` again,
  // so waiting on it would strand the page on a frozen last frame.
  if (WAIT_ACTIVITIES.has(act) && showing && !showing.paused) {
    const remaining = (showing.duration - showing.currentTime) * 1000;
    if (Number.isFinite(remaining) && remaining >= 0 && remaining <= WAIT_MS) {
      // spec 3.2: let the outgoing clip reach its own loop end (its neutral pose)
      // instead of cutting it mid-gesture. Clearing loop makes it fire `ended`,
      // which advance() (wired in prime(), above) is already listening for.
      showing.loop = false;
      pendingWaitFade = fadeMs;
      return;
    }
  }
  const stem = clipFor(act);
  if (!stem) return;
  if (act === "speaking" && stem === mouthClip) {
    // The renderer indexes the driving clip from frame 0 at every re-anchor - a new
    // turn is a re-anchor (FrameClock) - so the page has to be at frame 0 too, or the
    // pose around the crop is not the pose the crop was drawn into. show() already
    // rewinds a clip it is switching TO; this covers the case it bails on, where the
    // driving clip is an idle clip that is already the one on screen and the playhead
    // is the only thing that has to move.
    const v = els.get(stem);
    if (v === showing) { v.currentTime = 0; return; }
  }
  show(stem, { loop: act !== "idle", fadeMs });
}

function playOneShot(stem) {
  if (!have.has(stem)) return;           // no clip, no expression - never substitute idle
  oneShotUntil = Infinity;
  pendingWaitFade = 0;          // a fresh one-shot supersedes any pending wait
  refreshMouth();               // a mood gesture is not the driving clip: a crop cut
                                 // from idle2 over `amused` is somebody else's mouth
  show(stem, { loop: false });
}

function scheduleFlourish() {
  flourishAt = activity === "idle"
    ? performance.now() + FLOURISH_MIN_MS + Math.random() * (FLOURISH_MAX_MS - FLOURISH_MIN_MS)
    : 0;
}

// --- mouth: envelope -> playbackRate ---------------------------------------
function tick(now) {
  // Re-armed FIRST, so nothing below can end the loop. It used to be re-armed last,
  // which was safe while the body only nudged playbackRate; presentMouth() draws a
  // decoded bitmap, and a single throw there would have left a page that looks alive,
  // never crossfades again and never runs another flourish - permanently frozen, with
  // no error anyone would go looking for.
  requestAnimationFrame(tick);
  presentMouth(now);          // early, so the draw has the whole frame budget ahead
  if (showing && activity === "speaking") {
    // 1.0x while lip-sync drives the clip. The crops are frame-for-frame that clip's
    // own pixels, so modulating its rate slides the pose under the crop away from the
    // pose the renderer composited into it - v1's envelope IS the mouth, and here it
    // would be the seam. Pinned rather than skipped so a fallback to speaking_soft
    // does not inherit whatever rate the driving clip was left on.
    const rate = mouthReady() ? 1 : RATE_MIN + (RATE_MAX - RATE_MIN) * env;
    if (Math.abs(showing.playbackRate - rate) > 0.01) showing.playbackRate = rate;
    const want = clipFor("speaking");
    if (want && showing.dataset.stem !== want && !oneShotUntil) show(want);
  }
  if (flourishAt && performance.now() > flourishAt && activity === "idle") {
    flourishAt = 0;
    const f = FLOURISHES.filter(s => have.has(s));
    if (f.length) playOneShot(f[Math.floor(Math.random() * f.length)]);
  }
}

// --- wire ------------------------------------------------------------------
async function boot() {
  const manifest = await fetch("/face/manifest").then(r => r.json()).catch(() => ({ clips: [] }));
  have = new Set(manifest.clips);
  if (!have.size) {
    hint.hidden = false;
    hint.innerHTML =
      "No clips yet. Put them in <code>&lt;data_dir&gt;/face/</code> " +
      "&mdash; see <code>docs/superpowers/specs/2026-08-25-face-design.md</code> §4.";
    return;
  }
  await Promise.all([...have].map(prime));

  // Lip-sync, if the daemon says so. The manifest answers `false` for all three ways
  // there is no mouth - switch off, no renderer wired, renderer latched failed - so
  // the page never has to infer it from a failed request, and a driving clip whose
  // bytes are missing or undecodable is a fourth (videoWidth stays 0 and there is
  // nothing to lay the crop over). Any of them leaves v1 running, untouched.
  const ls = manifest.lipsync;
  const driver = ls && els.get(ls.clip);
  if (ls && driver && driver.videoWidth) {
    mouthClip = ls.clip;
    mouthStream();
  }

  toActivity("idle");
  requestAnimationFrame(tick);

  const es = new EventSource("/face/stream");   // reconnects on its own
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.kind === "shot") { playOneShot(e.clip); return; }
    if (e.activity !== activity) toActivity(e.activity);
    const target = e.activity === "speaking" ? e.level : 0;
    env += (target - env) * (target > env ? ATTACK : RELEASE);
    if (e.level >= LOUD_ENTER) { if (!loudSince) loudSince = performance.now(); }
    else loudSince = 0;
  };

  // The other half of self-healing: becoming visible again is exactly when the
  // browser will actually let a previously-withheld play() succeed.
  document.addEventListener("visibilitychange", () => {
    // refreshMouth too: rAF stopped while hidden, so the clip under the crop may be
    // the wrong one and the crop itself may be a frame from before the tab was hidden.
    if (document.visibilityState === "visible") { ensurePlaying(); refreshMouth(); }
  });
}

boot();
</script>
